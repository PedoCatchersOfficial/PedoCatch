<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Evidence & Incident Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="portal-wrapper">
        <header class="portal-header">
            <span class="secure-tag">Encrypted Endpoint</span>
            <h1>Incident & Evidence Intake</h1>
            <p>Securely submit target credentials and file evidence. All traffic is proxied anonymously.</p>
        </header>

        <form id="reportForm" novalidate>
            <div class="form-group">
                <label for="targetContact">Target Contact / Identifier</label>
                <input type="text" id="targetContact" required placeholder="Discord ID, Username, Email, or Phone Number">
            </div>

            <div class="form-group">
                <label for="details">Incident Summary / Description</label>
                <textarea id="details" rows="4" required placeholder="Provide a chronological description of the behavior or incident..."></textarea>
            </div>

            <div class="form-group">
                <label for="evidenceFiles">Evidence Upload (Screenshots, Logs, Files)</label>
                <div class="file-drop-zone" id="dropZone">
                    <input type="file" id="evidenceFiles" multiple accept="image/*,video/*,.txt,.log,.pdf" class="file-input">
                    <div class="file-drop-text">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        <span>Click to browse or drag & drop files here</span>
                        <small>Supports images, videos, documents, or logs (Max 10MB total)</small>
                    </div>
                </div>
                <div id="fileListPreview" class="file-list-preview"></div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">Transmit Secure Report</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div id="statusMessage" class="status-msg hidden"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
